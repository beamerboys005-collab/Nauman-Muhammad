<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 — Page Not Found | Nauman Muhammad</title>
  <meta name="description" content="The page you are looking for does not exist. Return to the home page of Nauman Muhammad's portfolio." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Syne:wght@700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, rgba(200,21,46,0.18) 0%, #060608 70%);
    }
    .error-content {
      max-width: 600px;
      position: relative;
      z-index: 2;
    }
    .error-code {
      font-family: var(--font-display, 'Cormorant Garamond', serif);
      font-size: clamp(90px, 18vw, 160px);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #ff2a4b, #8b0e20);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      text-shadow: 0 0 40px rgba(200,21,46,0.4);
    }
    .error-title {
      font-family: var(--font-label, 'Syne', sans-serif);
      font-size: clamp(22px, 4vw, 32px);
      color: #ffffff;
      margin-bottom: 16px;
    }
    .error-desc {
      color: var(--text-secondary, #9e9ea7);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body class="error-page">
  <div class="error-content">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Lost in Cyberspace</h1>
    <p class="error-desc">
      The coordinates you entered don't exist on this server. Let's get you back to the main command center.
    </p>
    <div class="error-actions">
      <a href="index.html" class="btn btn-primary">← Back to Portfolio</a>
      <a href="index.html#contact" class="btn btn-outline">Contact Nauman</a>
    </div>
  </div>
</body>
</html>
