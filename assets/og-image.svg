<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608"/>
      <stop offset="40%" stop-color="#120407"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <linearGradient id="ogAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a4b"/>
      <stop offset="50%" stop-color="#c8152e"/>
      <stop offset="100%" stop-color="#8b0e20"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="rgba(200,21,46,0.35)"/>
      <stop offset="100%" stop-color="rgba(6,6,8,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#glowRed)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="url(#ogAccent)" stroke-width="1.5" stroke-dasharray="80 300"/>

  <!-- Brand Monogram -->
  <g transform="translate(100, 100)">
    <rect width="80" height="80" rx="16" fill="#150206" stroke="#c8152e" stroke-width="2"/>
    <text x="40" y="52" font-family="sans-serif" font-size="34" font-weight="900" fill="#ff2a4b" text-anchor="middle">NM</text>
  </g>

  <!-- Subtitle Tag -->
  <text x="100" y="240" font-family="monospace" font-size="18" font-weight="600" fill="#ff2a4b" letter-spacing="4">PORTFOLIO &amp; AI STUDIO</text>

  <!-- Main Heading -->
  <text x="100" y="320" font-family="'Georgia', serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">NAUMAN MUHAMMAD</text>

  <!-- Role Subtitles -->
  <text x="100" y="380" font-family="sans-serif" font-size="24" font-weight="600" fill="#e0e0e0" letter-spacing="2">
    AI EXPERT  •  VIBE CODER  •  GRAPHIC DESIGNER  •  LEAD GEN SPECIALIST
  </text>

  <!-- Description -->
  <text x="100" y="440" font-family="sans-serif" font-size="18" fill="#9e9ea7">
    Transforming ideas into intelligent automations, high-converting digital products, and verified growth.
  </text>

  <!-- Badges -->
  <g transform="translate(100, 490)">
    <rect width="180" height="42" rx="6" fill="rgba(200,21,46,0.15)" stroke="rgba(200,21,46,0.5)" stroke-width="1"/>
    <text x="90" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#ff2a4b" text-anchor="middle">✓ Google Certified</text>
  </g>
  <g transform="translate(300, 490)">
    <rect width="180" height="42" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
    <text x="90" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">📈 Web Grow X Leads</text>
  </g>
  <g transform="translate(500, 490)">
    <rect width="180" height="42" rx="6" fill="rgba(217,119,87,0.15)" stroke="rgba(217,119,87,0.5)" stroke-width="1"/>
    <text x="90" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#d97757" text-anchor="middle">⚡ Anthropic Certified</text>
  </g>
</svg>
