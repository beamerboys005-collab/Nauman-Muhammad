<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150206"/>
      <stop offset="50%" stop-color="#060608"/>
      <stop offset="100%" stop-color="#2a050d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a4b"/>
      <stop offset="100%" stop-color="#c8152e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#c8152e" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,42,75,0.15)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="50" y="62" font-family="'Syne', 'Arial Black', sans-serif" font-size="40" font-weight="900" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="1">NM</text>
</svg>
